<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Припятский Национальный Заповедник</title>
</head>

<body>
    <div class="container">
        <h1>Интерактивная карта улиц города Гомеля:</h1>

        <div class="map-stage">
            <img src="image/Homel.png" alt="map">
            <div class="hotspot-layer"></div>
        </div>

        <div class="popup-overlay" hidden></div>
        <div class="map-popup1" hidden>
            <button type="button" class="popup-close" aria-label="Закрыть">×</button>
            <h2 class="popup-title"></h2>
            <details class="popup-details1">
                <summary class="popup-summary1"></summary>
                <p class="popup-text"></p>
            </details>
            <details class="popup-details2">
                <summary class="popup-summary2"></summary>
                <div class="popup-media"></div>
            </details>
        </div>
        <div class="map-popup2" hidden>
            <button type="button" class="popup-close" aria-label="Закрыть">×</button>
            <h2 class="popup-title"></h2>
            <details class="popup-details1">
                <summary class="popup-summary1"></summary>
                <p class="popup-text"></p>
            </details>
            <details class="popup-details2">
                <summary class="popup-summary2"></summary>
                <div class="popup-media"></div>
            </details>
        </div>
    </div>

    <script src="code.js"></script>
</body>

</html>
